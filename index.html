<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Workout Timer & Session Player</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
        }

        /* Workout List Grid */
        #workout-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        @media (min-width: 640px) {
            #workout-list {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .workout-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .workout-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.1);
        }

        .workout-info h3 {
            font-size: 1.1rem;
            margin-bottom: 0.4rem;
        }

        .workout-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .workout-meta {
            display: flex;
            gap: 0.5rem;
        }

        .badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-weight: 600;
        }

        /* Modal Preview Screen */
        #preview-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            flex-grow: 1;
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            background: rgba(15, 23, 42, 0.3);
        }

        /* Step Preview List */
        .step-preview-list {
            list-style: none;
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .step-preview-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.4);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
            font-size: 0.9rem;
        }

        /* Active Workout Session Screen */
        #active-session {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .intensity-banner {
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            transition: background-color 0.4s ease;
        }

        .intensity-banner h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .intensity-banner p {
            font-size: 1.1rem;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .timer-display {
            font-size: 5rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            margin: 1rem 0;
            letter-spacing: -2px;
        }

        .overall-progress-container {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin: 1.5rem 0 0.5rem 0;
        }

        .overall-progress-bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s linear;
        }

        .session-meta-row {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .next-preview-box {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Controls Layout */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .control-row {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            width: 100%;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            flex: 1;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #334155;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .btn-danger {
            background-color: #ef4444;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        @keyframes pulseAlert {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .pulsing {
            animation: pulseAlert 1s infinite;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- App Header (Hidden during active workout) -->
        <header id="app-header">
            <h1>Pro Workout Sessions</h1>
            <p>Select a structured routine to preview and launch</p>
        </header>

        <!-- Main Workout List -->
        <div id="workout-list"></div>

        <!-- Active Workout Session Player -->
        <div id="active-session">
            <div id="intensity-banner" class="intensity-banner">
                <h2 id="step-name">Warm Up</h2>
                <p id="step-intensity-label">Intensity Level: 2 / 10</p>
            </div>

            <div class="timer-display" id="section-timer">05:00</div>

            <div class="next-preview-box" id="next-preview-text">
                Up Next: Loading...
            </div>

            <div class="session-meta-row">
                <span id="overall-timer-text">Total Remaining: 30:00</span>
                <span id="current-phase-indicator">Phase 1 of 6</span>
            </div>

            <div class="overall-progress-container">
                <div class="overall-progress-bar" id="overall-progress"></div>
            </div>

            <!-- Structured Controls -->
            <div class="controls">
                <!-- Row 1: Back & Next -->
                <div class="control-row">
                    <button class="btn btn-secondary" onclick="app.prevStep()">⏮ Prev</button>
                    <button class="btn btn-secondary" onclick="app.nextStep()">Next ⏭</button>
                </div>
                <!-- Row 2: Start/Resume Button -->
                <div class="control-row">
                    <button class="btn" id="pause-btn" onclick="app.togglePause()">Start/Resume</button>
                </div>
                <!-- Row 3: Utility / Exit Actions -->
                <div class="control-row">
                    <button class="btn btn-secondary" onclick="app.restartStep()">↺ Restart Step</button>
                    <button class="btn btn-danger" onclick="app.exitWorkout()">Exit</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div id="preview-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 id="modal-title" style="margin-bottom: 0.25rem;">Workout Title</h2>
                    <p id="modal-desc" style="color: var(--text-muted); font-size: 0.9rem;"></p>
                </div>
                <button class="btn btn-secondary" style="padding: 0.4rem 0.8rem; flex: none;" onclick="app.closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                    <span class="badge" id="modal-badge-duration" style="background: #3b82f6; color: white;">0 Mins</span>
                    <span class="badge" id="modal-badge-steps" style="background: #334155; color: #cbd5e1;">0 Steps</span>
                </div>
                <h4 style="font-size: 0.95rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Session Structure Breakdown</h4>
                <ul class="step-preview-list" id="modal-steps-list">
                    <!-- Populated dynamically -->
                </ul>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="app.closeModal()">Cancel</button>
                <button class="btn" onclick="app.confirmStartWorkout()">▶ Start Workout (Paused)</button>
            </div>
        </div>
    </div>

        class WorkoutApp {
            constructor() {
                this.currentWorkout = null;
                this.currentStepIndex = 0;
                this.timeLeftInStep = 0;
                this.totalTimeLeft = 0;
                this.totalWorkoutDuration = 0;
                this.timerInterval = null;
                this.isPaused = true;
                this.audioCtx = null;
                this.pendingWorkout = null;

                this.initList();
            }

            initAudio() {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playBeep(frequency = 587.33, duration = 0.15, type = 'sine') {
                try {
                    this.initAudio();
                    if (this.audioCtx.state === 'suspended') {
                        this.audioCtx.resume();
                    }
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.value = frequency;
                    gain.gain.setValueAtTime(0.15, this.audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.audioCtx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    osc.start();
                    osc.stop(this.audioCtx.currentTime + duration);
                } catch (e) {
                    console.log("Audio not allowed yet");
                }
            }

            initList() {
                const listEl = document.getElementById('workout-list');
                listEl.innerHTML = '';

                workouts.forEach(w => {
                    const card = document.createElement('div');
                    card.className = 'workout-card';
                    card.innerHTML = `
                        <div class="workout-info">
                            <h3>${w.id}. ${w.name}</h3>
                            <p>${w.description}</p>
                        </div>
                        <div class="workout-meta">
                            <span class="badge" style="background: #3b82f6; color: white;">${w.duration} Mins</span>
                            <span class="badge" style="background: #334155; color: #cbd5e1;">${w.steps.length} Steps</span>
                        </div>
                    `;
                    card.onclick = () => this.openPreview(w);
                    listEl.appendChild(card);
                });
            }

            openPreview(workout) {
                this.pendingWorkout = workout;
                document.getElementById('modal-title').innerText = workout.name;
                document.getElementById('modal-desc').innerText = workout.description;
                document.getElementById('modal-badge-duration').innerText = `${workout.duration} Mins`;
                document.getElementById('modal-badge-steps').innerText = `${workout.steps.length} Steps`;

                const stepsListEl = document.getElementById('modal-steps-list');
                stepsListEl.innerHTML = '';

                workout.steps.forEach((step, idx) => {
                    const item = document.createElement('li');
                    item.className = 'step-preview-item';
                    const color = levelColors[step.level] || '#3b82f6';
                    item.style.borderLeftColor = color;
                    item.innerHTML = `
                        <span><strong>${idx + 1}. ${step.name}</strong></span>
                        <div>
                            <span class="badge" style="background: ${color}; color: white; margin-right: 0.5rem;">Lvl ${step.level}</span>
                            <span style="color: var(--text-muted); font-size: 0.85rem;">${this.formatTime(step.duration)}</span>
                        </div>
                    `;
                    stepsListEl.appendChild(item);
                });

                document.getElementById('preview-modal').style.display = 'flex';
            }

            closeModal() {
                document.getElementById('preview-modal').style.display = 'none';
                this.pendingWorkout = null;
            }

            confirmStartWorkout() {
                if (!this.pendingWorkout) return;
                const workout = this.pendingWorkout;
                this.closeModal();

                this.currentWorkout = workout;
                this.currentStepIndex = 0;
                this.isPaused = true; 
                document.getElementById('pause-btn').innerText = "Start/Resume";

                this.totalWorkoutDuration = workout.steps.reduce((acc, step) => acc + step.duration, 0);
                this.totalTimeLeft = this.totalWorkoutDuration;

                // Hide header and list, show active session
                document.getElementById('app-header').style.display = 'none';
                document.getElementById('workout-list').style.display = 'none';
                document.getElementById('active-session').style.display = 'block';

                this.loadStep(0);
                this.startTimer();
            }

            loadStep(index) {
                const step = this.currentWorkout.steps[index];
                this.timeLeftInStep = step.duration;

                document.getElementById('step-name').innerText = step.name;
                document.getElementById('step-intensity-label').innerText = `Intensity Level: ${step.level} / 10`;
                document.getElementById('current-phase-indicator').innerText = `Phase ${index + 1} of ${this.currentWorkout.steps.length}`;

                const banner = document.getElementById('intensity-banner');
                const colorHex = levelColors[step.level] || '#3b82f6';
                banner.style.backgroundColor = colorHex;

                if (step.level >= 9) {
                    banner.classList.add('pulsing');
                } else {
                    banner.classList.remove('pulsing');
                }

                const nextPreviewEl = document.getElementById('next-preview-text');
                if (index + 1 < this.currentWorkout.steps.length) {
                    const nextStep = this.currentWorkout.steps[index + 1];
                    nextPreviewEl.innerText = `Up Next: ${nextStep.name} (Lvl ${nextStep.level}) — ${this.formatTime(nextStep.duration)}`;
                } else {
                    nextPreviewEl.innerText = `Final Step of Session!`;
                }

                this.updateDisplay();
            }

            startTimer() {
                if (this.timerInterval) clearInterval(this.timerInterval);

                this.timerInterval = setInterval(() => {
                    if (this.isPaused) return;

                    if (this.timeLeftInStep > 0) {
                        if (this.timeLeftInStep <= 4 && this.timeLeftInStep > 1) {
                            this.playBeep(440, 0.1, 'sine');
                        } else if (this.timeLeftInStep === 1) {
                            this.playBeep(880, 0.2, 'triangle');
                        }

                        this.timeLeftInStep--;
                        this.totalTimeLeft--;
                        this.updateDisplay();
                    } else {
                        this.currentStepIndex++;
                        if (this.currentStepIndex < this.currentWorkout.steps.length) {
                            this.loadStep(this.currentStepIndex);
                        } else {
                            this.finishWorkout();
                        }
                    }
                }, 1000);
            }

            updateDisplay() {
                document.getElementById('section-timer').innerText = this.formatTime(this.timeLeftInStep);
                document.getElementById('overall-timer-text').innerText = `Total Remaining: ${this.formatTime(this.totalTimeLeft)}`;

                const elapsed = this.totalWorkoutDuration - this.totalTimeLeft;
                const percent = Math.min(100, Math.max(0, (elapsed / this.totalWorkoutDuration) * 100));
                document.getElementById('overall-progress').style.width = `${percent}%`;
            }

            formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }

            togglePause() {
                this.isPaused = !this.isPaused;
                document.getElementById('pause-btn').innerText = this.isPaused ? "Start/Resume" : "Pause";
            }

            nextStep() {
                if (this.currentStepIndex + 1 < this.currentWorkout.steps.length) {
                    const currentStep = this.currentWorkout.steps[this.currentStepIndex];
                    this.totalTimeLeft -= this.timeLeftInStep;
                    this.currentStepIndex++;
                    this.loadStep(this.currentStepIndex);
                } else {
                    this.finishWorkout();
                }
            }

            prevStep() {
                if (this.currentStepIndex > 0) {
                    const currentStep = this.currentWorkout.steps[this.currentStepIndex];
                    this.totalTimeLeft += (currentStep.duration - this.timeLeftInStep);
                    this.currentStepIndex--;
                    this.loadStep(this.currentStepIndex);
                }
            }

            restartStep() {
                const step = this.currentWorkout.steps[this.currentStepIndex];
                this.totalTimeLeft += (step.duration - this.timeLeftInStep);
                this.timeLeftInStep = step.duration;
                this.updateDisplay();
            }

            exitWorkout() {
                if (this.timerInterval) clearInterval(this.timerInterval);
                document.getElementById('active-session').style.display = 'none';
                document.getElementById('app-header').style.display = 'block';
                document.getElementById('workout-list').style.display = 'grid';
            }

            finishWorkout() {
                if (this.timerInterval) clearInterval(this.timerInterval);
                this.playBeep(523.25, 0.2);
                setTimeout(() => this.playBeep(659.25, 0.2), 200);
                setTimeout(() => this.playBeep(783.99, 0.4), 400);

                alert("🎉 Workout Completed Successfully!");
                this.exitWorkout();
            }
        }

        const app = new WorkoutApp();
    </script>
</body>
</html>
