<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCN-Style Structured Workout Tracker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            
            /* Intensity Colors 1-10 */
            --lvl-1: #22c55e;
            --lvl-2: #4ade80;
            --lvl-3: #84cc16;
            --lvl-4: #eab308;
            --lvl-5: #facc15;
            --lvl-6: #f97316;
            --lvl-7: #ea580c;
            --lvl-8: #dc2626;
            --lvl-9: #ef4444;
            --lvl-10: #b91c1c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            max-width: 600px;
        }

        header h1 {
            font-size: 1.75rem;
            margin-bottom: 6px;
            color: #fff;
            letter-spacing: 0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        /* Workout Selection List */
        #workout-list {
            display: grid;
            gap: 12px;
        }

        .workout-card {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .workout-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }

        .workout-info h3 {
            font-size: 1.1rem;
            margin-bottom: 4px;
            color: #fff;
        }

        .workout-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .workout-meta {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .badge {
            background: #334155;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Active Session Screen */
        #active-session {
            display: none;
            background-color: var(--card-bg);
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: border-color 0.4s ease;
        }

        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
        }

        .back-btn {
            background: #334155;
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .back-btn:hover {
            background: #475569;
        }

        .overall-timer-display {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Intensity Color Panel */
        .intensity-banner {
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            color: #fff;
            transition: background-color 0.4s ease, transform 0.2s ease;
        }

        .current-step-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .intensity-level-indicator {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            opacity: 0.9;
        }

        .section-timer {
            font-size: 4rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .next-preview {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-top: 12px;
        }

        /* Progress Bar Across Whole Workout */
        .progress-track {
            background: #0f172a;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .progress-fill {
            background: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.3s linear;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .ctrl-btn {
            background: #334155;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .ctrl-btn:hover {
            background: #475569;
        }

        .ctrl-btn.primary {
            background: var(--accent);
        }

        .ctrl-btn.primary:hover {
            background: #2563eb;
        }

        /* Pulse animation for high intensity */
        @keyframes pulse-red {
            0% { transform: scale(1); }
            50% { transform: scale(1.01); box-shadow: 0 0 25px rgba(239, 68, 68, 0.4); }
            100% { transform: scale(1.01); }
        }

        .pulsing {
            animation: pulse-red 1.5s infinite;
        }
    </style>
</head>

    <header>

                <button class="back-btn" onclick="app.exitWorkout()">← Choose Another</button>
                <div class="overall-timer-display" id="overall-timer-text">Total Remaining: 30:00</div>
            </div>

            <!-- Overall Progress Bar -->
            <div class="progress-track">
                <div class="progress-fill" id="overall-progress"></div>
            </div>

            <!-- Color Coded Step Banner -->
            <div class="intensity-banner" id="intensity-banner">

                <div class="intensity-level-indicator" id="step-intensity-label">Intensity Level: 2 / 10</div>
                <div class="section-timer" id="section-timer">00:30</div>
                <div class="next-preview" id="next-preview-text">Up Next: Zone Increase</div>
            </div>

            <!-- Playback Controls -->
            <div class="controls">
                <button class="ctrl-btn" onclick="app.togglePause()" id="pause-btn">Pause</button>
                <button class="ctrl-btn" onclick="app.restartStep()">Restart Step</button>
            </div>
        </div>

        class WorkoutApp {
            constructor() {
                this.currentWorkout = null;
                this.currentStepIndex = 0;
                this.timeLeftInStep = 0;
                this.totalTimeLeft = 0;
                this.totalWorkoutDuration = 0;
                this.timerInterval = null;
                this.isPaused = false;
                this.audioCtx = null;

                this.initList();
            }

            initAudio() {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playBeep(frequency = 587.33, duration = 0.15, type = 'sine') {
                try {
                    this.initAudio();
                    if (this.audioCtx.state === 'suspended') {
                        this.audioCtx.resume();
                    }
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.value = frequency;
                    gain.gain.setValueAtTime(0.15, this.audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.audioCtx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    osc.start();
                    osc.stop(this.audioCtx.currentTime + duration);
                } catch (e) {
                    console.log("Audio not allowed yet");
                }
            }

            initList() {
                const listEl = document.getElementById('workout-list');
                listEl.innerHTML = '';

                workouts.forEach(w => {
                    const card = document.createElement('div');
                    card.className = 'workout-card';
                    card.innerHTML = `
                        <div class="workout-info">
                            <h3>${w.id}. ${w.name}</h3>
                            <p>${w.description}</p>
                        </div>
                        <div class="workout-meta">
                            <span class="badge" style="background: #3b82f6; color: white;">${w.duration} Mins</span>
                            <span class="badge" style="background: #334155; color: #cbd5e1;">${w.steps.length} Steps</span>
                        </div>
                    `;
                    card.onclick = () => this.startWorkout(w);
                    listEl.appendChild(card);
                });
            }

            startWorkout(workout) {
                this.currentWorkout = workout;
                this.currentStepIndex = 0;
                this.isPaused = false;
                document.getElementById('pause-btn').innerText = "Pause";

                // Calculate total duration in seconds
                this.totalWorkoutDuration = workout.steps.reduce((acc, step) => acc + step.duration, 0);
                this.totalTimeLeft = this.totalWorkoutDuration;

                // Toggle views
                document.getElementById('workout-list').style.display = 'none';
                document.getElementById('active-session').style.display = 'block';

                this.loadStep(0);
                this.startTimer();
            }

            loadStep(index) {
                const step = this.currentWorkout.steps[index];
                this.timeLeftInStep = step.duration;

                // Update UI elements
                document.getElementById('step-name').innerText = step.name;
                document.getElementById('step-intensity-label').innerText = `Intensity Level: ${step.level} / 10`;
                
                // Color banner styling
                const banner = document.getElementById('intensity-banner');
                const colorHex = levelColors[step.level] || '#3b82f6';
                banner.style.backgroundColor = colorHex;

                if (step.level >= 9) {
                    banner.classList.add('pulsing');
                } else {
                    banner.classList.remove('pulsing');
                }

                // Next step preview
                const nextPreviewEl = document.getElementById('next-preview-text');
                if (index + 1 < this.currentWorkout.steps.length) {
                    const nextStep = this.currentWorkout.steps[index + 1];
                    nextPreviewEl.innerText = `Up Next: ${nextStep.name} (Lvl ${nextStep.level}) - ${this.formatTime(nextStep.duration)}`;
                } else {
                    nextPreviewEl.innerText = `Final Step of Session!`;
                }

                this.updateDisplay();
            }

            startTimer() {
                if (this.timerInterval) clearInterval(this.timerInterval);

                this.timerInterval = setInterval(() => {
                    if (this.isPaused) return;

                    if (this.timeLeftInStep > 0) {
                        // Countdown beeps in last 3 seconds of step
                        if (this.timeLeftInStep <= 4 && this.timeLeftInStep > 1) {
                            this.playBeep(440, 0.1, 'sine');
                        } else if (this.timeLeftInStep === 1) {
                            this.playBeep(880, 0.2, 'triangle'); // Higher pitch transition cue
                        }

                        this.timeLeftInStep--;
                        this.totalTimeLeft--;
                        this.updateDisplay();
                    } else {
                        // Move to next step or finish
                        this.currentStepIndex++;
                        if (this.currentStepIndex < this.currentWorkout.steps.length) {
                            this.loadStep(this.currentStepIndex);
                        } else {
                            this.finishWorkout();
                        }
                    }
                }, 1000);
            }

            updateDisplay() {
                // Section timer
                document.getElementById('section-timer').innerText = this.formatTime(this.timeLeftInStep);

                // Overall timer
                document.getElementById('overall-timer-text').innerText = `Total Remaining: ${this.formatTime(this.totalTimeLeft)}`;

                // Progress bar
                const elapsed = this.totalWorkoutDuration - this.totalTimeLeft;
                const percent = (elapsed / this.totalWorkoutDuration) * 100;
                document.getElementById('overall-progress').style.width = `${percent}%`;
            }

            formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }

            togglePause() {
                this.isPaused = !this.isPaused;
                document.getElementById('pause-btn').innerText = this.isPaused ? "Resume" : "Pause";
            }

            restartStep() {
                const step = this.currentWorkout.steps[this.currentStepIndex];
                // Adjust total time left balance
                this.totalTimeLeft += (step.duration - this.timeLeftInStep);
                this.timeLeftInStep = step.duration;
                this.updateDisplay();
            }

            exitWorkout() {
                if (this.timerInterval) clearInterval(this.timerInterval);
                document.getElementById('active-session').style.display = 'none';
                document.getElementById('workout-list').style.display = 'grid';
            }

            finishWorkout() {
                if (this.timerInterval) clearInterval(this.timerInterval);
                this.playBeep(523.25, 0.2);
                setTimeout(() => this.playBeep(659.25, 0.2), 200);
                setTimeout(() => this.playBeep(783.99, 0.4), 400);

                alert("🎉 Workout Completed Successfully!");
                this.exitWorkout();
            }
        }

        const app = new WorkoutApp();
    </script>
</body>
